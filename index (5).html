<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulldog Estúdio — Inventário</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Barlow+Condensed:wght@700;800&display=swap');

  :root {
    --black:   #1a1a1a;
    --dark:    #2b2b2b;
    --header:  #4d4d4d;
    --header-dark: #3c3c3c;
    --mid:     #555555;
    --muted:   #b5b5b5;
    --border:  #d0d0d0;
    --light:   #f0f0f0;
    --off-white: #f7f7f7;
    --white:   #ffffff;
    --accent:  #3a3a3a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--off-white);
    color: var(--black);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    padding: 20px 24px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 3px solid var(--border);
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-title { color: var(--black); }

  .header-title h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
  }

  .header-title span {
    font-size: 0.62rem;
    letter-spacing: 0.35em;
    color: var(--mid);
    text-transform: uppercase;
    font-weight: 400;
    display: block;
    margin-top: 4px;
  }

  .header-right {
    margin-left: auto;
    text-align: right;
    flex-shrink: 0;
  }

  .header-right p {
    color: var(--mid);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }

  .header-right input#today-date {
    color: var(--black);
    font-size: 0.9rem;
    font-weight: 600;
    display: block;
    margin-top: 2px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    text-align: right;
    font-family: 'Inter', sans-serif;
    padding: 2px 0;
    outline: none;
    max-width: 130px;
  }

  /* ── NAV ── */
  nav.page-nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav.page-nav::-webkit-scrollbar { display: none; }

  nav.page-nav .nav-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    color: var(--mid);
    padding: 8px 14px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    background: var(--white);
    transition: background .15s, color .15s, border-color .15s;
    white-space: nowrap;
    flex-shrink: 0;
  }

  nav.page-nav .nav-btn:hover,
  nav.page-nav .nav-btn:active {
    border-color: var(--header);
    color: var(--black);
    background: var(--light);
  }

  nav.page-nav .nav-btn.nav-active {
    background: var(--header);
    border-color: var(--header);
    color: var(--white);
  }

  nav.page-nav .nav-btn-total {
    background: var(--black);
    border-color: var(--black);
    color: var(--white);
  }

  nav.page-nav .nav-btn-total.nav-active {
    background: var(--dark);
    border-color: var(--dark);
  }

  /* ── MAIN ── */
  main {
    max-width: 1300px;
    margin: 24px auto;
    padding: 0 16px 80px;
  }

  .section-block { display: none; }
  .section-block.section-active { display: block; }

  .section-block {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 32px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }

  .section-header {
    background: var(--header);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .section-dot {
    width: 8px; height: 8px;
    background: var(--white);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .section-header h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white);
  }

  .section-header .item-count {
    margin-left: auto;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }

  /* ── TOOLBAR ── */
  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 16px;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 3px;
    cursor: pointer;
    border: none;
    transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-dark { background: var(--black); color: var(--white); }
  .btn-dark:hover { background: var(--dark); }

  .btn-outline {
    background: transparent;
    color: var(--black);
    border: 1.5px solid var(--border);
  }
  .btn-outline:hover { border-color: var(--black); background: var(--light); }

  /* ── DESKTOP TABLE (hidden on mobile) ── */
  .desktop-table-wrap { display: block; }

  .inv-table {
    width: 100%;
    border-collapse: collapse;
  }

  .inv-table thead tr {
    background: var(--light);
    border-bottom: 2px solid var(--border);
  }

  .inv-table th {
    padding: 12px 14px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--mid);
    text-align: left;
  }

  .inv-table th.num { text-align: center; width: 48px; }
  .inv-table th.col-objeto  { width: 40%; }
  .inv-table th.col-qtd     { width: 80px; text-align: center; }
  .inv-table th.col-valor   { width: 120px; text-align: right; }
  .inv-table th.col-valor-total { width: 130px; text-align: right; }
  .inv-table th.col-foto    { width: 120px; text-align: center; }
  .inv-table th.col-obs     { width: 14%; }

  .inv-table tbody tr:nth-child(even) { background: var(--off-white); }
  .inv-table tbody tr:hover { background: #ebebeb; }

  .inv-table td {
    padding: 0;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .row-num {
    text-align: center;
    font-size: 0.68rem;
    color: var(--mid);
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 0 8px;
    user-select: none;
    width: 48px;
  }

  .inv-table td input,
  .inv-table td textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.84rem;
    color: var(--black);
    padding: 10px 14px;
    outline: none;
    resize: none;
    line-height: 1.4;
  }

  .inv-table td input::placeholder,
  .inv-table td textarea::placeholder { color: #c0c0c0; }

  .inv-table td input:focus,
  .inv-table td textarea:focus {
    background: #fff8e1;
    box-shadow: inset 0 0 0 2px #d4c060;
  }

  .inv-table td.col-qtd input { text-align: center; }
  .inv-table td.col-valor input { text-align: right; font-variant-numeric: tabular-nums; }

  .inv-table td.col-valor-total {
    text-align: right;
    padding: 10px 14px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--black);
  }

  /* ── OBJETO + LUPA ── */
  .objeto-cell { display: flex; align-items: flex-start; }
  .objeto-cell textarea { flex: 1; white-space: pre-wrap; word-break: break-word; overflow: hidden; min-height: 40px; }
  .objeto-cell .search-btn,
  .objeto-cell .delete-btn { margin-top: 6px; }

  .search-btn, .delete-btn {
    flex-shrink: 0;
    width: 28px; height: 28px;
    margin-right: 6px;
    border: none;
    background: var(--light);
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--mid);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
  }
  .search-btn:hover { background: var(--header); color: var(--white); }
  .delete-btn:hover { background: #b03a3a; color: var(--white); }

  /* ── PHOTO CELL ── */
  .col-foto { text-align: center; padding: 8px; }

  .photo-box {
    width: 64px; height: 64px;
    margin: 0 auto;
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    background: var(--off-white);
    position: relative;
    transition: border-color .15s, background .15s;
  }
  .photo-box:hover { border-color: var(--mid); background: var(--light); }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }
  .photo-box .photo-plus { font-size: 1.3rem; color: var(--mid); line-height: 1; }
  .photo-box .photo-remove {
    position: absolute; top: 2px; right: 2px;
    width: 16px; height: 16px;
    background: rgba(26,26,26,.75); color: var(--white);
    border-radius: 50%; font-size: 0.6rem;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .photo-input { display: none; }

  /* ── TOTAL ROW ── */
  .total-row { background: var(--black) !important; border-top: 3px solid var(--dark); }
  .total-row td { border-bottom: none; padding: 14px 14px; color: var(--white); }

  .total-label {
    font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase;
    font-weight: 700; color: var(--muted); text-align: right; padding-right: 14px;
  }
  .total-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.5rem; font-weight: 800; letter-spacing: 0.04em;
    color: var(--white); text-align: right; padding-right: 14px;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }

  /* ── GRAND TOTAL ── */
  .grand-total-wrap { margin-top: 16px; display: flex; justify-content: flex-end; }

  .grand-total-card {
    background: var(--black); color: var(--white);
    border-radius: 4px; padding: 16px 24px;
    display: flex; align-items: center; gap: 24px;
    min-width: 280px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    width: 100%;
    max-width: 400px;
  }

  .grand-total-card .gt-label {
    font-size: 0.68rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
  }

  .grand-total-card .gt-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.8rem; font-weight: 800;
    letter-spacing: 0.04em; margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ── TOTAIS TABLE (Total Geral section) ── */
  .totais-table { width: 100%; border-collapse: collapse; }
  .totais-table th {
    padding: 12px 14px; font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--mid);
    text-align: left; background: var(--light); border-bottom: 2px solid var(--border);
  }
  .totais-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.86rem; }
  .totais-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  /* ═══════════════════════════════════════════════
     MOBILE CARD LAYOUT
     ═══════════════════════════════════════════════ */
  .mobile-cards-wrap { display: none; }

  .mobile-card {
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--white);
    transition: background .15s;
  }
  .mobile-card:nth-child(even) { background: var(--off-white); }

  .mobile-card-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 10px;
  }

  .mobile-card-num {
    font-size: 0.65rem; color: var(--muted); font-weight: 700;
    letter-spacing: 0.05em; padding-top: 10px; width: 24px;
    flex-shrink: 0; text-align: center;
  }

  .mobile-card-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }

  .mobile-card-actions .search-btn,
  .mobile-card-actions .delete-btn {
    margin-right: 0;
    width: 32px; height: 32px;
  }

  .mobile-card textarea {
    flex: 1;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    color: var(--black);
    padding: 8px 10px;
    outline: none;
    resize: none;
    line-height: 1.4;
    border-radius: 3px;
    min-height: 40px;
  }
  .mobile-card textarea:focus { background: #fff8e1; border-color: #d4c060; }

  .mobile-card-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
    margin-left: 32px;
  }

  .mobile-field-group { display: flex; flex-direction: column; gap: 4px; }

  .mobile-field-group label {
    font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--mid); font-weight: 600;
  }

  .mobile-field-group input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.88rem;
    color: var(--black);
    padding: 8px 10px;
    outline: none;
    border-radius: 3px;
  }
  .mobile-field-group input:focus { background: #fff8e1; border-color: #d4c060; }

  .mobile-card-bottom {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-left: 32px;
  }

  .mobile-total-display {
    flex: 1;
    background: var(--light);
    border-radius: 3px;
    padding: 8px 12px;
    font-size: 0.8rem;
    color: var(--mid);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mobile-total-display .mtd-label {
    font-size: 0.6rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
  }
  .mobile-total-display .mtd-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  /* mobile photo box — slightly larger for touch */
  .mobile-photo-box {
    width: 48px; height: 48px;
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; overflow: hidden;
    background: var(--off-white); position: relative;
    flex-shrink: 0;
  }
  .mobile-photo-box img { width: 100%; height: 100%; object-fit: cover; }
  .mobile-photo-box .photo-plus { font-size: 1.1rem; color: var(--mid); }
  .mobile-photo-box .photo-remove {
    position: absolute; top: 1px; right: 1px;
    width: 14px; height: 14px;
    background: rgba(26,26,26,.75); color: var(--white);
    border-radius: 50%; font-size: 0.55rem;
    display: flex; align-items: center; justify-content: center;
  }

  /* obs field full width on mobile */
  .mobile-obs-wrap {
    margin-left: 32px;
    margin-top: 8px;
  }
  .mobile-obs-wrap input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    color: var(--black);
    padding: 7px 10px;
    outline: none;
    border-radius: 3px;
  }
  .mobile-obs-wrap input::placeholder { color: #c0c0c0; }
  .mobile-obs-wrap input:focus { background: #fff8e1; border-color: #d4c060; }

  /* mobile section total bar */
  .mobile-section-total {
    background: var(--black);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mobile-section-total .mst-label {
    font-size: 0.65rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted);
  }
  .mobile-section-total .mst-value {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem; font-weight: 800;
    color: var(--white); font-variant-numeric: tabular-nums;
  }

  /* ── BREAKPOINT: switch to mobile layout ── */
  @media (max-width: 700px) {
    header { padding: 14px 16px 12px; }
    .header-title h1 { font-size: 1.5rem; }
    main { padding: 0 0 80px; margin: 12px auto; }
    .toolbar { padding: 0 16px; margin-bottom: 12px; }
    .btn { font-size: 0.68rem; padding: 9px 14px; }
    .desktop-table-wrap { display: none; }
    .mobile-cards-wrap { display: block; }
    .grand-total-wrap { padding: 0 16px; }
    .grand-total-card { max-width: 100%; }
  }

  /* ── PRINT ── */
  @media print {
    header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    nav.page-nav { display: none; }
    .toolbar { display: none; }
    .section-header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .total-row { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .grand-total-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: white; }
    .section-block { display: block !important; }
    tr.print-empty-row { display: none !important; }
    .mobile-cards-wrap { display: none !important; }
    .desktop-table-wrap { display: block !important; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="header-title">
      <h1>Bulldog</h1>
      <span>Estúdio</span>
    </div>
  </div>
  <div class="header-right">
    <p>Inventário</p>
    <input type="date" id="today-date" oninput="saveDate(this.value)">
  </div>
</header>

<nav class="page-nav" id="page-nav"></nav>

<main>
  <div class="toolbar">
    <button class="btn btn-dark" id="btn-save" onclick="saveAllNow()">💾 Salvar</button>
    <button class="btn btn-dark" onclick="window.print()">↓ PDF</button>
    <button class="btn btn-outline" onclick="exportExcel()">⇩ Excel</button>
  </div>

  <div id="sections-container"></div>

  <div class="grand-total-wrap">
    <div class="grand-total-card">
      <div>
        <div class="gt-label">Total Geral do Inventário</div>
      </div>
      <div class="gt-value" id="grand-total">R$ 0,00</div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://huyngxdugrypvpukzime.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1eW5neGR1Z3J5cHZwdWt6aW1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNTQyNDUsImV4cCI6MjA5NzgzMDI0NX0.jAkOup9c4ASt7wbdxwNBW8w3da1FOqv8WnJCsAE0_Ik';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const ROWS_PER_SECTION = 200;

  const SECTIONS = [
    { "id": "hall",        "name": "Hall de Entrada" },
    { "id": "quarto",      "name": "Quarto de Equipamentos" },
    { "id": "escritorio1", "name": "Escritório 1º Andar" },
    { "id": "estudio",     "name": "Estúdio" },
    { "id": "hall2",       "name": "Hall 2º Andar" },
    { "id": "camarim",     "name": "Camarim" },
    { "id": "escritorio2", "name": "Escritório 2º Andar" },
    { "id": "producao",    "name": "Quarto de Produção" },
    { "id": "jardim",      "name": "Jardim" },
    { "id": "gourmet",     "name": "Rooftop" }
  ];

  // ── Date
  async function saveDate(value) {
    await sb.from('config').upsert({ key: 'date', value });
  }

  async function loadDate() {
    const input = document.getElementById('today-date');
    const { data } = await sb.from('config').select('value').eq('key', 'date').maybeSingle();
    if (data && data.value) {
      input.value = data.value;
    } else {
      const iso = new Date().toISOString().slice(0, 10);
      input.value = iso;
      saveDate(iso);
    }
  }

  // ── Nav
  function buildNav() {
    const nav = document.getElementById('page-nav');
    SECTIONS.forEach((sec, idx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'nav-btn' + (idx === 0 ? ' nav-active' : '');
      btn.textContent = sec.name;
      btn.dataset.target = sec.id;
      btn.onclick = () => showSection(sec.id);
      nav.appendChild(btn);
    });

    const totalBtn = document.createElement('button');
    totalBtn.type = 'button';
    totalBtn.className = 'nav-btn nav-btn-total';
    totalBtn.textContent = 'Total Geral';
    totalBtn.dataset.target = 'totais';
    totalBtn.onclick = () => showSection('totais');
    nav.appendChild(totalBtn);
  }

  function showSection(id) {
    document.querySelectorAll('.section-block').forEach(el => {
      el.classList.toggle('section-active', el.id === `section-${id}`);
    });
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('nav-active', btn.dataset.target === id);
    });
    // Scroll active nav button into view
    const activeBtn = document.querySelector(`.nav-btn[data-target="${id}"]`);
    if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    if (id === 'totais') refreshTotaisOverview();
  }

  // ── Totais overview
  function buildTotaisOverview() {
    const container = document.getElementById('sections-container');
    const block = document.createElement('div');
    block.className = 'section-block';
    block.id = 'section-totais';
    block.innerHTML = `
      <div class="section-header">
        <div class="section-dot"></div>
        <h2>Total Geral do Patrimônio</h2>
      </div>
      <div class="desktop-table-wrap">
        <table class="totais-table">
          <thead><tr><th>Local</th><th style="text-align:right">Total (R$)</th></tr></thead>
          <tbody id="tbody-totais"></tbody>
          <tfoot>
            <tr class="total-row">
              <td class="total-label">Patrimônio Total</td>
              <td class="total-value" id="total-patrimonio">R$ 0,00</td>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="mobile-cards-wrap" id="mobile-totais"></div>
      <div class="mobile-section-total" style="display:none" id="mobile-totais-bar">
        <span class="mst-label">Patrimônio Total</span>
        <span class="mst-value" id="mobile-total-patrimonio">R$ 0,00</span>
      </div>
    `;
    container.appendChild(block);
  }

  function refreshTotaisOverview() {
    // desktop
    const tbody = document.getElementById('tbody-totais');
    tbody.innerHTML = '';
    SECTIONS.forEach(sec => {
      const totalEl = document.getElementById(`total-${sec.id}`);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="padding:12px 14px;">${sec.name}</td>
        <td style="padding:12px 14px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600;">${totalEl ? totalEl.textContent : 'R$ 0,00'}</td>
      `;
      tbody.appendChild(tr);
    });
    const grandVal = document.getElementById('grand-total').textContent;
    document.getElementById('total-patrimonio').textContent = grandVal;

    // mobile
    const mobileDiv = document.getElementById('mobile-totais');
    mobileDiv.innerHTML = '';
    SECTIONS.forEach(sec => {
      const totalEl = document.getElementById(`total-${sec.id}`);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:0.86rem;';
      row.innerHTML = `
        <span>${sec.name}</span>
        <span style="font-weight:700;font-variant-numeric:tabular-nums;">${totalEl ? totalEl.textContent : 'R$ 0,00'}</span>
      `;
      mobileDiv.appendChild(row);
    });

    const mobileBar = document.getElementById('mobile-totais-bar');
    mobileBar.style.display = 'flex';
    document.getElementById('mobile-total-patrimonio').textContent = grandVal;
  }

  // ── Build sections
  function buildSections() {
    const container = document.getElementById('sections-container');
    SECTIONS.forEach((sec, idx) => {
      const block = document.createElement('div');
      block.className = 'section-block' + (idx === 0 ? ' section-active' : '');
      block.id = `section-${sec.id}`;
      block.innerHTML = `
        <div class="section-header">
          <div class="section-dot"></div>
          <h2>${sec.name}</h2>
          <span class="item-count">${ROWS_PER_SECTION} linhas</span>
        </div>
        <!-- Desktop table -->
        <div class="desktop-table-wrap">
          <table class="inv-table">
            <thead>
              <tr>
                <th class="num">#</th>
                <th class="col-objeto">Objeto</th>
                <th class="col-qtd">Qtd.</th>
                <th class="col-valor">Valor Unit. (R$)</th>
                <th class="col-valor-total">Valor Total (R$)</th>
                <th class="col-foto">Foto</th>
                <th class="col-obs">Observação</th>
              </tr>
            </thead>
            <tbody id="tbody-${sec.id}"></tbody>
            <tfoot>
              <tr class="total-row">
                <td colspan="4" class="total-label">Total — ${sec.name}</td>
                <td class="total-value" id="total-${sec.id}">R$ 0,00</td>
                <td colspan="2"></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <!-- Mobile cards -->
        <div class="mobile-cards-wrap" id="mobile-${sec.id}"></div>
        <div class="mobile-section-total">
          <span class="mst-label">Total — ${sec.name}</span>
          <span class="mst-value" id="mobile-total-${sec.id}">R$ 0,00</span>
        </div>
      `;
      container.appendChild(block);
      buildRows(`tbody-${sec.id}`, sec.id, ROWS_PER_SECTION);
      buildMobileCards(`mobile-${sec.id}`, sec.id, ROWS_PER_SECTION);
    });
  }

  // ── Build desktop rows
  function buildRows(tbodyId, prefix, count) {
    const tbody = document.getElementById(tbodyId);
    for (let i = 1; i <= count; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="row-num">${String(i).padStart(2,'0')}</td>
        <td class="col-objeto">
          <div class="objeto-cell">
            <button type="button" class="search-btn" title="Pesquisar preço médio" onclick="searchObjeto(this)">🔍</button>
            <button type="button" class="delete-btn" title="Apagar item" data-section="${prefix}" data-row="${i}" onclick="deleteItem(this)">🗑️</button>
            <textarea rows="1" placeholder="Nome do objeto" data-section="${prefix}" data-row="${i}" data-field="obj" oninput="autoGrow(this); save('${prefix}',${i},'obj',this.value)"></textarea>
          </div>
        </td>
        <td class="col-qtd"><input type="number" min="0" placeholder="0" data-section="${prefix}" data-row="${i}" data-field="qtd" oninput="save('${prefix}',${i},'qtd',this.value)"></td>
        <td class="col-valor"><input type="text" placeholder="0,00" data-section="${prefix}" data-row="${i}" data-field="val" oninput="handleValor(this,'${prefix}',${i})" onblur="clampValor(this,'${prefix}',${i})"></td>
        <td class="col-valor-total"><span class="valor-total-display" data-section="${prefix}" data-row="${i}">R$ 0,00</span></td>
        <td class="col-foto">
          <div class="photo-box" data-section="${prefix}" data-row="${i}" onclick="triggerPhoto(this)">
            <span class="photo-plus">+</span>
            <input type="file" class="photo-input" accept="image/*" data-section="${prefix}" data-row="${i}" onchange="handlePhoto(this)">
          </div>
        </td>
        <td class="col-obs"><input type="text" placeholder="Observação" data-section="${prefix}" data-row="${i}" data-field="obs" oninput="save('${prefix}',${i},'obs',this.value)"></td>
      `;
      tbody.appendChild(tr);
    }
  }

  // ── Build mobile cards
  function buildMobileCards(containerId, prefix, count) {
    const wrap = document.getElementById(containerId);
    for (let i = 1; i <= count; i++) {
      const card = document.createElement('div');
      card.className = 'mobile-card';
      card.id = `mcard-${prefix}-${i}`;
      card.innerHTML = `
        <div class="mobile-card-top">
          <div class="mobile-card-num">${String(i).padStart(2,'0')}</div>
          <div class="mobile-card-actions">
            <button type="button" class="search-btn" title="Pesquisar" onclick="searchObjetoMobile(this)">🔍</button>
            <button type="button" class="delete-btn" title="Apagar" data-section="${prefix}" data-row="${i}" onclick="deleteItemMobile(this)">🗑️</button>
          </div>
          <textarea rows="1" placeholder="Nome do objeto"
            data-section="${prefix}" data-row="${i}" data-field="obj"
            oninput="autoGrow(this); save('${prefix}',${i},'obj',this.value)"></textarea>
        </div>
        <div class="mobile-card-fields">
          <div class="mobile-field-group">
            <label>Qtd.</label>
            <input type="number" min="0" placeholder="0"
              data-section="${prefix}" data-row="${i}" data-field="qtd"
              oninput="save('${prefix}',${i},'qtd',this.value)">
          </div>
          <div class="mobile-field-group">
            <label>Valor Unit. (R$)</label>
            <input type="text" placeholder="0,00"
              data-section="${prefix}" data-row="${i}" data-field="val"
              oninput="handleValor(this,'${prefix}',${i})"
              onblur="clampValor(this,'${prefix}',${i})">
          </div>
        </div>
        <div class="mobile-card-bottom">
          <div class="mobile-total-display">
            <span class="mtd-label">Total</span>
            <span class="mtd-value valor-total-display" data-section="${prefix}" data-row="${i}">R$ 0,00</span>
          </div>
          <div class="mobile-photo-box" data-section="${prefix}" data-row="${i}" onclick="triggerMobilePhoto(this)">
            <span class="photo-plus">+</span>
            <input type="file" class="photo-input" accept="image/*" data-section="${prefix}" data-row="${i}" onchange="handlePhoto(this)">
          </div>
        </div>
        <div class="mobile-obs-wrap">
          <input type="text" placeholder="Observação"
            data-section="${prefix}" data-row="${i}" data-field="obs"
            oninput="save('${prefix}',${i},'obs',this.value)">
        </div>
      `;
      wrap.appendChild(card);
    }
  }

  // ── Search helpers
  function searchObjeto(btn) {
    const textarea = btn.closest('.objeto-cell').querySelector('textarea');
    const term = (textarea.value || '').trim();
    if (!term) { alert('Digite o nome do objeto antes de pesquisar.'); return; }
    window.open('https://www.google.com/search?q=' + encodeURIComponent(term + ' preço médio usado de mercado'), '_blank');
  }

  function searchObjetoMobile(btn) {
    const card = btn.closest('.mobile-card');
    const textarea = card.querySelector('textarea');
    const term = (textarea.value || '').trim();
    if (!term) { alert('Digite o nome do objeto antes de pesquisar.'); return; }
    window.open('https://www.google.com/search?q=' + encodeURIComponent(term + ' preço médio usado de mercado'), '_blank');
  }

  function autoGrow(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
  }

  // ── Delete
  async function deleteItem(btn) {
    if (!confirm('Deletar o item permanentemente?')) return;
    const section = btn.dataset.section, row = btn.dataset.row;
    const tr = btn.closest('tr');
    tr.querySelectorAll('input[type="text"], input[type="number"]').forEach(i => i.value = '');
    tr.querySelectorAll('textarea').forEach(t => { t.value = ''; autoGrow(t); });
    const box = tr.querySelector('.photo-box');
    if (box) renderPhoto(box, null);
    _clearMobileCard(section, row);
    recalc(section);
    await sb.from('itens').delete().eq('section', section).eq('row', Number(row));
  }

  async function deleteItemMobile(btn) {
    if (!confirm('Deletar o item permanentemente?')) return;
    const section = btn.dataset.section, row = btn.dataset.row;
    const card = btn.closest('.mobile-card');
    card.querySelectorAll('input[type="text"], input[type="number"]').forEach(i => i.value = '');
    card.querySelectorAll('textarea').forEach(t => { t.value = ''; autoGrow(t); });
    const mbox = card.querySelector('.mobile-photo-box');
    if (mbox) renderMobilePhoto(mbox, null);
    _clearDesktopRow(section, row);
    recalc(section);
    await sb.from('itens').delete().eq('section', section).eq('row', Number(row));
  }

  function _clearMobileCard(section, row) {
    const card = document.getElementById(`mcard-${section}-${row}`);
    if (!card) return;
    card.querySelectorAll('input[type="text"], input[type="number"]').forEach(i => i.value = '');
    card.querySelectorAll('textarea').forEach(t => { t.value = ''; autoGrow(t); });
    const mbox = card.querySelector('.mobile-photo-box');
    if (mbox) renderMobilePhoto(mbox, null);
  }

  function _clearDesktopRow(section, row) {
    const sel = `[data-section="${section}"][data-row="${row}"]`;
    document.querySelectorAll(`#tbody-${section} ${sel}`).forEach(inp => { inp.value = ''; if (inp.tagName === 'TEXTAREA') autoGrow(inp); });
    const box = document.querySelector(`#tbody-${section} .photo-box${sel}`);
    if (box) renderPhoto(box, null);
  }

  // ── Storage
  const saveTimers = {};
  const pendingData = {};

  function save(section, row, field, value) {
    const rowKey = `${section}-${row}`;
    pendingData[rowKey] = pendingData[rowKey] || { section, row: Number(row) };
    pendingData[rowKey][field] = value;
    if (saveTimers[rowKey]) clearTimeout(saveTimers[rowKey]);
    saveTimers[rowKey] = setTimeout(() => flushRow(rowKey), 500);
    recalc(section);
    // Sync desktop <-> mobile
    syncFields(section, row, field, value);
  }

  // Keep desktop table and mobile cards in sync
  function syncFields(section, row, field, value) {
    // sync all inputs/textareas with same data-section/row/field EXCEPT the one currently focused
    const active = document.activeElement;
    const sel = field === 'obj' ? 'textarea' : 'input';
    document.querySelectorAll(`${sel}[data-section="${section}"][data-row="${row}"][data-field="${field}"]`).forEach(el => {
      if (el !== active && el.value !== value) {
        el.value = value;
        if (field === 'obj') autoGrow(el);
      }
    });
  }

  async function flushRow(rowKey) {
    const data = pendingData[rowKey];
    delete saveTimers[rowKey];
    if (!data) return;
    delete pendingData[rowKey];
    await sb.from('itens').upsert(data, { onConflict: 'section,row' });
  }

  async function saveAllNow() {
    const btn = document.getElementById('btn-save');
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = 'Salvando…';
    try {
      Object.keys(saveTimers).forEach(k => clearTimeout(saveTimers[k]));
      await Promise.all(Object.keys(pendingData).map(k => flushRow(k)));
      btn.textContent = '✔ Salvo!';
    } catch (e) {
      console.error(e); btn.textContent = '✖ Erro';
    } finally {
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
    }
  }

  function handleValor(input, section, row) { save(section, row, 'val', input.value); }

  function clampValor(input, section, row) {
    let n = parseValor(input.value);
    if (n < 0) n = 0;
    if (n > 100000) n = 100000;
    const formatted = n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
    input.value = input.value.trim() === '' ? '' : formatted;
    save(section, row, 'val', input.value);
  }

  function parseValor(str) {
    if (!str) return 0;
    let s = str.replace(/\s/g,'');
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g,'').replace(',','.');
    else s = s.replace(',','.');
    return parseFloat(s) || 0;
  }

  function formatBRL(n) {
    return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  function recalc(section) {
    let total = 0;
    // Use desktop tbody as source of truth for calculation
    const tbody = document.getElementById(`tbody-${section}`);
    tbody.querySelectorAll('tr').forEach(tr => {
      const qtdInp = tr.querySelector('input[data-field="qtd"]');
      const valInp = tr.querySelector('input[data-field="val"]');
      const qtd = parseFloat((qtdInp.value || '0').replace(',','.')) || 0;
      const val = parseValor(valInp.value);
      const rowTotal = qtd * val;
      const row = qtdInp.dataset.row;
      // Update ALL .valor-total-display with matching section+row
      document.querySelectorAll(`.valor-total-display[data-section="${section}"][data-row="${row}"]`).forEach(el => {
        el.textContent = formatBRL(rowTotal);
      });
      total += rowTotal;
    });
    // Update both desktop and mobile section totals
    const dtEl = document.getElementById(`total-${section}`);
    if (dtEl) dtEl.textContent = formatBRL(total);
    const mbEl = document.getElementById(`mobile-total-${section}`);
    if (mbEl) mbEl.textContent = formatBRL(total);
    recalcGrand();
  }

  function recalcGrand() {
    let grand = 0;
    SECTIONS.forEach(sec => {
      const el = document.getElementById(`total-${sec.id}`);
      if (el) grand += parseValor(el.textContent.replace('R$','').trim());
    });
    document.getElementById('grand-total').textContent = formatBRL(grand);
  }

  // ── Photo (desktop)
  function triggerPhoto(box) { box.querySelector('.photo-input').click(); }

  function triggerMobilePhoto(box) { box.querySelector('.photo-input').click(); }

  function handlePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        const maxDim = 800;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale); height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        const section = input.dataset.section, row = input.dataset.row;
        // Render in both desktop and mobile
        const deskBox = document.querySelector(`#tbody-${section} .photo-box[data-section="${section}"][data-row="${row}"]`);
        if (deskBox) renderPhoto(deskBox, dataUrl);
        const mobBox = document.querySelector(`#mcard-${section}-${row} .mobile-photo-box`);
        if (mobBox) renderMobilePhoto(mobBox, dataUrl);
        await sb.from('itens').upsert({ section, row: Number(row), foto: dataUrl }, { onConflict: 'section,row' });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function removePhoto(e, section, row) {
    e.stopPropagation();
    const deskBox = document.querySelector(`#tbody-${section} .photo-box[data-section="${section}"][data-row="${row}"]`);
    if (deskBox) renderPhoto(deskBox, null);
    const mobBox = document.querySelector(`#mcard-${section}-${row} .mobile-photo-box`);
    if (mobBox) renderMobilePhoto(mobBox, null);
    await sb.from('itens').upsert({ section, row: Number(row), foto: null }, { onConflict: 'section,row' });
  }

  function renderPhoto(box, dataUrl) {
    const section = box.dataset.section, row = box.dataset.row;
    if (dataUrl) {
      box.innerHTML = `
        <img src="${dataUrl}" alt="Foto">
        <div class="photo-remove" onclick="removePhoto(event,'${section}',${row})">×</div>
        <input type="file" class="photo-input" accept="image/*" data-section="${section}" data-row="${row}" onchange="handlePhoto(this)">
      `;
    } else {
      box.innerHTML = `
        <span class="photo-plus">+</span>
        <input type="file" class="photo-input" accept="image/*" data-section="${section}" data-row="${row}" onchange="handlePhoto(this)">
      `;
    }
  }

  function renderMobilePhoto(box, dataUrl) {
    const section = box.dataset.section, row = box.dataset.row;
    if (dataUrl) {
      box.innerHTML = `
        <img src="${dataUrl}" alt="Foto">
        <div class="photo-remove" onclick="removePhoto(event,'${section}',${row})">×</div>
        <input type="file" class="photo-input" accept="image/*" data-section="${section}" data-row="${row}" onchange="handlePhoto(this)">
      `;
    } else {
      box.innerHTML = `
        <span class="photo-plus">+</span>
        <input type="file" class="photo-input" accept="image/*" data-section="${section}" data-row="${row}" onchange="handlePhoto(this)">
      `;
    }
  }

  // ── Load all
  async function loadAll() {
    const { data, error } = await sb.from('itens').select('*');
    if (error) { console.error('Erro ao carregar:', error); return; }
    (data || []).forEach(item => {
      ['obj','qtd','val','obs'].forEach(f => {
        const val = item[f];
        if (val !== null && val !== undefined && val !== '') {
          const isSel = f === 'obj' ? 'textarea' : 'input';
          // Fill all matching fields (desktop + mobile)
          document.querySelectorAll(`${isSel}[data-section="${item.section}"][data-row="${item.row}"][data-field="${f}"]`).forEach(inp => {
            inp.value = val;
            if (f === 'obj') autoGrow(inp);
          });
        }
      });
      if (item.foto) {
        const deskBox = document.querySelector(`#tbody-${item.section} .photo-box[data-section="${item.section}"][data-row="${item.row}"]`);
        if (deskBox) renderPhoto(deskBox, item.foto);
        const mobBox = document.querySelector(`#mcard-${item.section}-${item.row} .mobile-photo-box`);
        if (mobBox) renderMobilePhoto(mobBox, item.foto);
      }
    });
    SECTIONS.forEach(sec => recalc(sec.id));
  }

  // ── Print prep
  function rowHasData(tr) {
    const ta = tr.querySelector('textarea');
    if (ta && ta.value.trim() !== '') return true;
    for (const inp of tr.querySelectorAll('input[type="text"], input[type="number"]')) {
      if (inp.value && inp.value.trim() !== '') return true;
    }
    return !!tr.querySelector('.photo-box img');
  }

  function prepareForPrint() {
    document.querySelectorAll('#sections-container tbody tr').forEach(tr => {
      tr.classList.toggle('print-empty-row', !rowHasData(tr));
    });
  }
  window.addEventListener('beforeprint', prepareForPrint);

  // ── Excel export
  function exportExcel() {
    const wb = XLSX.utils.book_new();
    SECTIONS.forEach(sec => {
      const tbody = document.getElementById(`tbody-${sec.id}`);
      const rows = [['#','Objeto','Qtd.','Valor Unitário (R$)','Valor Total (R$)','Observação']];
      tbody.querySelectorAll('tr').forEach(tr => {
        if (!rowHasData(tr)) return;
        rows.push([
          tr.querySelector('.row-num').textContent,
          tr.querySelector('textarea').value,
          tr.querySelector('input[data-field="qtd"]').value,
          tr.querySelector('input[data-field="val"]').value,
          tr.querySelector('.valor-total-display').textContent,
          tr.querySelector('input[data-field="obs"]').value
        ]);
      });
      const totalText = document.getElementById(`total-${sec.id}`).textContent;
      rows.push(['','','','','','']);
      rows.push(['','','','Total',totalText,'']);
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:5},{wch:40},{wch:8},{wch:16},{wch:16},{wch:30}];
      XLSX.utils.book_append_sheet(wb, ws, sec.name.substring(0, 31));
    });
    const totalsRows = [['Local','Total (R$)']];
    SECTIONS.forEach(sec => {
      const el = document.getElementById(`total-${sec.id}`);
      totalsRows.push([sec.name, el ? el.textContent : 'R$ 0,00']);
    });
    totalsRows.push(['Patrimônio Total', document.getElementById('grand-total').textContent]);
    const wsTotais = XLSX.utils.aoa_to_sheet(totalsRows);
    wsTotais['!cols'] = [{wch:30},{wch:16}];
    XLSX.utils.book_append_sheet(wb, wsTotais, 'Totais');
    const date = document.getElementById('today-date').value || new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, `Bulldog_Inventario_${date}.xlsx`);
  }

  buildNav();
  buildSections();
  buildTotaisOverview();
  loadDate();
  loadAll();
</script>
</body>
